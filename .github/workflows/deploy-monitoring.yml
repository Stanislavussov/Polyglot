name: Deploy Monitoring

on:
  push:
    branches: [master]
    paths:
      - "deploy/monitoring/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy monitoring configs to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --exclude='data/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy/monitoring/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/monitoring/
          rm -f ~/.ssh/deploy_key

      - name: Start monitoring stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/monitoring

            docker network create polyglot-network 2>/dev/null || true

            export GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}"

            docker compose -f docker-compose.monitoring.yml pull

            docker compose -f docker-compose.monitoring.yml up -d --remove-orphans

            docker image prune -f
