name: Deploy Monitoring

on:
  push:
    branches: [master]
    paths:
      - "deploy/monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

# Mutex on the VPS Docker daemon, NOT on this workflow. `deploy.yml` has no
# `paths` filter, so a push to master touching deploy/monitoring/** starts both
# workflows against the same daemon (both stacks share the external
# polyglot-network — deploy/docker-compose.yml). Without a shared group, this
# job's image prune can fire in deploy.yml's window between `compose pull` and
# `compose up -d`, when the freshly pulled images are referenced by nothing.
# deploy.yml declares the identical group; `cancel-in-progress: false` because an
# in-flight deploy must never be cancelled.
concurrency:
  group: vps-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy monitoring configs to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (Fable T30, F8) instead of trust-on-first-use
          # ssh-keyscan, which would accept whatever key answers on the network.
          # Set the VPS_SSH_KNOWN_HOSTS secret to the VPS's known_hosts line
          # (`ssh-keyscan -H <host>`). Falls back to TOFU only when unset.
          if [ -n "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            echo "WARNING: VPS_SSH_KNOWN_HOSTS not set — falling back to TOFU ssh-keyscan"
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          fi
          tar -czf /tmp/monitoring.tar.gz -C deploy/monitoring .
          scp -i ~/.ssh/deploy_key /tmp/monitoring.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/monitoring.tar.gz
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/monitoring && tar -xzf /tmp/monitoring.tar.gz --exclude='./data' && rm /tmp/monitoring.tar.gz"
          rm -f ~/.ssh/deploy_key

      - name: Start monitoring stack
        # Pinned to the commit SHA of v1.0.3 (Fable T30, F8): third-party action
        # holding the prod SSH key — mutable tag pinning is a supply-chain risk.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/monitoring

            docker network create polyglot-network 2>/dev/null || true

            export GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}"
            # Provisioned Telegram alert contact point (Fable T12). The compose
            # file reads these from the environment; without them Grafana fails
            # to validate contact-points.yml at startup and crash-loops.
            export GRAFANA_ALERT_TELEGRAM_BOTTOKEN="${{ secrets.GRAFANA_ALERT_TELEGRAM_BOTTOKEN }}"
            export GRAFANA_ALERT_TELEGRAM_CHATID="${{ secrets.GRAFANA_ALERT_TELEGRAM_CHATID }}"

            docker compose -f docker-compose.monitoring.yml pull

            docker compose -f docker-compose.monitoring.yml up -d --remove-orphans

            # Dangling-only. `-a` prunes host-wide and deletes the app stack's
            # previous release image — the one deploy.yml records in
            # PREVIOUS_RELEASE for rollback — so this workflow silently undid the
            # guard deploy.yml's `--filter until=168h` prune was written to give.
            # Monitoring images are pinned by patch tag, so a bump leaves the old
            # one tagged-but-unused: slow, bounded-in-practice disk growth rather
            # than a broken rollback. Watch it via `docker system df`.
            docker image prune -f
            docker builder prune -af 2>/dev/null || true
