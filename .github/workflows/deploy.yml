name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  ci:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Setup Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run remote commands
        run: |
          ssh -tt -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            export HOME=/root
            export DOCKER_CONFIG=/root/.docker
            mkdir -p /root/.ssh
            ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null

            echo "SSH login successful"
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin && echo "Docker login successful"

            mkdir -p /opt/polyglot
            if [ -d /opt/polyglot/.git ]; then
              cd /opt/polyglot
              git pull git@github.com:${{ secrets.REPOSITORY }}.git master
            else
              rm -rf /opt/polyglot
              git clone git@github.com:${{ secrets.REPOSITORY }}.git /opt/polyglot
              cd /opt/polyglot
            fi

            docker pull ${{ secrets.DOCKER_USERNAME }}/polyglot:latest
            docker compose up -d --remove-orphans
            docker image prune -f
          '
