name: Deploy to VPS

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: migrate
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot:migrate-latest

  migrate:
    needs: push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull migration image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/polyglot:migrate-latest

      - name: Run migrations
        run: |
          docker run --rm \
            -e DATABASE_URL \
            ${{ secrets.DOCKER_USERNAME }}/polyglot:migrate-latest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare files
        run: |
          cp deploy/docker-compose.yml ./docker-compose.yml

          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot:latest" >> .env
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "AI_MODEL=${{ secrets.AI_MODEL }}" >> .env
          echo "AI_MODEL_FALLBACK=${{ secrets.AI_MODEL_FALLBACK }}" >> .env
          echo "REPOSITORY=${{ secrets.REPOSITORY }}" >> .env

      - name: Copy Compose and Env to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "/opt/polyglot"
          overwrite: true
          rm: true

      - name: Deploy and Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/polyglot

            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f
