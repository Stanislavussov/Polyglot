name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  ci:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run remote commands
        run: |
          ssh -T -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'docker compose pull'