name: Deploy to VPS

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

# Branch selects the target: master → production, anything else → development.
# The GitHub environment of the same name supplies the host-specific secrets
# (VPS_*, *_DOMAIN, DATABASE_URL, BOT_TOKEN, JWT_SECRET, ...); a name missing
# from the environment falls back to the repository secret, so `production`
# stays empty and inherits everything, while `development` overrides only what
# differs. Both jobs that read secrets must carry the same `environment:`.
env:
  REGISTRY: docker.io
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
  # dev images are tagged dev-<sha> so a Docker Hub listing tells the two apart.
  IMAGE_TAG: ${{ github.ref == 'refs/heads/master' && github.sha || format('dev-{0}', github.sha) }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # Explicit pass-through (not `secrets: inherit`) for auditability — repo
    # secrets do NOT flow through workflow_call automatically. The integration
    # job needs no secrets: its Postgres is a runner-local service container.
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  push:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    # Images go to Docker Hub (REGISTRY: docker.io) authenticated with
    # DOCKER_TOKEN, never to GHCR, so the GitHub Packages write scope this job
    # used to request granted something nothing here uses.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # prod parity: .nvmrc=26, deploy/Dockerfile* use node:26-alpine
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh admin report artifacts
        run: pnpm reports:sync-admin

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Required for the type=gha cache below: the default `docker` driver has no
      # cross-run cache export.
      - uses: docker/setup-buildx-action@v3

      # Exports base/deps/build too, because `production` resolves
      # `COPY --from=build`. Must stay the FIRST build using scope=bot — see the
      # note on the migrate build at the bottom of this job.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-bot:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin-api
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-admin-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=admin-api
          cache-to: type=gha,mode=max,scope=admin-api

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.admin
          target: production
          build-args: |
            PUBLIC_API_URL=https://${{ secrets.ADMIN_API_DOMAIN }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-admin:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      # mode=min: a small static Astro build, not worth a full-layer export
      # against the repo's shared 10 GB Actions cache budget.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.landing
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-landing:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=min,scope=landing

      # Reads scope=bot but deliberately does NOT export to it. `migrate` is
      # `FROM build` plus three metadata-only layers, so everything it needs is
      # already in the bot export. A second cache-to into scope=bot would write a
      # newer index that shadows the production one on the next run, evicting the
      # `pnpm install --frozen-lockfile --prod` layer — the most expensive one in
      # the image — from the restorable set. That is the opposite of the point.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: migrate
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot:migrate-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=bot

  deploy:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
    # Mutex on the VPS Docker daemon, shared with deploy-monitoring.yml, which
    # declares the identical group. Scoped to this job rather than the whole
    # workflow on purpose: the host is only touched for the ~2 min this job runs,
    # not the ~8 min including ci+push. GitHub keeps at most one PENDING run per
    # group and a newer one evicts the older, so a wider window raises the chance
    # of silently dropping a queued monitoring deploy (deploy.yml never deploys
    # monitoring, so such a run is not absorbed — it must be re-dispatched).
    # The group name `vps-host` is load-bearing for prod: deploy-monitoring.yml
    # declares the identical group. Dev is a separate host and daemon, so it gets
    # its own mutex and never queues behind a prod release.
    concurrency:
      group: ${{ github.ref == 'refs/heads/master' && 'vps-host' || 'vps-host-dev' }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Dev runs on a fresh copy of production data every deploy: a Neon branch
      # is a copy-on-write snapshot that costs seconds, and migrating it with
      # the develop migrations is exactly the rehearsal a master merge will
      # perform for real. The parent is the project's default branch
      # (production) — deliberately not pinned, so a branch rename in Neon
      # cannot silently re-parent dev onto stale data. The previous dev/*
      # branches are pruned at the end of a successful deploy, so at most one
      # extra compute endpoint is ever live.
      - name: Cut dev database from production (Neon branch)
        if: env.DEPLOY_ENV == 'development'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          name="dev/${GITHUB_SHA:0:12}"

          # A re-run of this job finds the branch its failed attempt cut, and
          # creating the same name again is a 409 — so "Re-run failed jobs" could
          # never recover a dev deploy that failed after this step. That branch never
          # served the running stack (a failed deploy keeps the previous release), so
          # it is dropped and cut again from current production.
          existing="$(curl -fsS "${auth[@]}" "${api}/branches" \
            | jq -r --arg name "$name" '.branches[] | select(.name == $name) | .id')"
          for id in $existing; do
            echo "Replacing dev branch ${name} (${id}) left by a previous attempt"
            curl -fsS "${auth[@]}" -X DELETE "${api}/branches/${id}" >/dev/null
          done

          created="$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" -X POST "${api}/branches" \
            -d "{\"branch\":{\"name\":\"${name}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")"
          branch_id="$(jq -r '.branch.id' <<<"$created")"
          url="$(jq -r '.connection_uris[0].connection_uri // empty' <<<"$created")"
          if [ -z "$url" ] || [ "$branch_id" = "null" ]; then
            echo "::error::Neon did not return a branch id + connection string"; jq 'del(.connection_uris)' <<<"$created"; exit 1
          fi
          echo "::add-mask::$url"

          # The endpoint is provisioned asynchronously; the migrate step on the
          # VPS connects a few minutes from now, but do not rely on that.
          for _ in $(seq 1 30); do
            state="$(curl -fsS "${auth[@]}" "${api}/branches/${branch_id}" | jq -r '.branch.current_state')"
            [ "$state" = "ready" ] && break
            sleep 2
          done
          echo "Dev database branch ${name} (${branch_id}) state: ${state}"

          echo "DEV_DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DEV_DB_BRANCH_ID=${branch_id}" >> "$GITHUB_ENV"

      - name: Prepare files
        run: |
          cp deploy/docker-compose.yml ./docker-compose.yml

          # Release announcements are a production-only signal: the dev bot
          # talks to testers' chats and must not narrate every develop push.
          RELEASE_ANNOUNCEMENT_BASE64=""
          if [ "$DEPLOY_ENV" = "production" ]; then
          RELEASE_ANNOUNCEMENT_BASE64="$(python - <<'PY'
          from pathlib import Path
          import base64

          # A single environment variable string cannot exceed the kernel's
          # MAX_ARG_STRLEN (~128 KB); a value larger than that makes every exec in
          # the bot container (including its healthcheck) fail with E2BIG
          # ("argument list too long"). The announcement is also delivered as one
          # Telegram message, which is hard-capped at 4096 characters. So bound the
          # extracted changelog well under both limits — a growing Unreleased
          # section must never be able to break the deploy.
          MAX_CHARS = 3500

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          in_unreleased = False
          collected = []
          for line in lines:
              if line.startswith("## [Unreleased]"):
                  in_unreleased = True
                  continue
              if in_unreleased and line.startswith("## ["):
                  break
              if in_unreleased:
                  collected.append(line)

          message = "\n".join(collected).strip()
          if len(message) > MAX_CHARS:
              truncated = message[:MAX_CHARS]
              boundary = truncated.rfind("\n")
              if boundary > 0:
                  truncated = truncated[:boundary]
              message = truncated.rstrip() + "\n\n…\n(See the full changelog for all changes.)"
          if message:
              print(base64.b64encode(message.encode("utf-8")).decode("ascii"))
          PY
          )"
          fi

          echo "BOT_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot-bot:${{ env.IMAGE_TAG }}" >> .env
          echo "MIGRATE_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot:migrate-${{ env.IMAGE_TAG }}" >> .env
          echo "ADMIN_API_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot-admin-api:${{ env.IMAGE_TAG }}" >> .env
          echo "ADMIN_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot-admin:${{ env.IMAGE_TAG }}" >> .env
          echo "LANDING_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/polyglot-landing:${{ env.IMAGE_TAG }}" >> .env
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          # Dev: the branch cut above. Prod: the managed production database.
          echo "DATABASE_URL=${DEV_DATABASE_URL:-${{ secrets.DATABASE_URL }}}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "ADMIN_PANEL_URL=https://${{ secrets.ADMIN_PANEL_DOMAIN }}" >> .env
          echo "PUBLIC_API_URL=https://${{ secrets.ADMIN_API_DOMAIN }}" >> .env
          echo "REPOSITORY=${{ secrets.REPOSITORY }}" >> .env
          echo "RELEASE_ID=${{ github.sha }}" >> .env
          echo "RELEASE_AUDIENCE_GROUPS=admin,tester" >> .env
          echo "RELEASE_ANNOUNCEMENT_BASE64=${RELEASE_ANNOUNCEMENT_BASE64}" >> .env

      - name: Copy Compose and Env to VPS
        # Pinned to the commit SHA of v1.0.0 (Fable T30, F8): this third-party
        # action carries the prod SSH key, so a mutable tag must not be able to
        # ship new code under it.
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env"
          target: "/opt/polyglot"
          overwrite: true

      - name: Deploy and Restart on VPS
        # Pinned to the commit SHA of v1.0.3 (Fable T30, F8): third-party action
        # holding the prod SSH key — mutable tag pinning is a supply-chain risk.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          DEV_RESET_USERS: ${{ vars.DEV_RESET_USERS }}
        with:
          # The action's default is 10m, but this script's worst case is ~19-21m:
          # `compose pull` of five images over the VPS link (3-5m) + migrate + seed
          # + `up -d` + the health gate below, which alone allows 180s x 4 services
          # = 12m. Without this, a slow-but-healthy release is severed AFTER
          # `docker compose up -d` has already mutated production, leaving no
          # health-gate verdict. `timeout-minutes` cannot save it — the SSH step
          # dies first.
          command_timeout: 30m
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Forwarded into the remote script's environment (appleboy `envs`).
          # DEV_RESET_USERS is a `development` environment *variable*, not a
          # secret: usernames/ids of testers whose accounts are wiped on every
          # dev deploy so they can walk onboarding again from /start.
          envs: DEPLOY_ENV,DEV_RESET_USERS
          script: |
            set -e
            cd /opt/polyglot

            # Restrict the freshly-scp'd secrets file (Fable T30, F7): it holds
            # every runtime secret (DB URL, JWT secret, bot/OpenRouter tokens) and
            # must not be world/group-readable on the host.
            chmod 600 .env

            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Rollback safety net (T13): record the currently-running images BEFORE
            # we pull/replace them, so a bad release can be reverted. See
            # @docs/agents/deployment.md for the rollback procedure.
            {
              echo "BOT_IMAGE_NAME=$(docker inspect --format '{{.Config.Image}}' polyglot_bot 2>/dev/null)"
              echo "ADMIN_API_IMAGE_NAME=$(docker inspect --format '{{.Config.Image}}' polyglot_admin_api 2>/dev/null)"
              echo "ADMIN_IMAGE_NAME=$(docker inspect --format '{{.Config.Image}}' polyglot_admin 2>/dev/null)"
              echo "LANDING_IMAGE_NAME=$(docker inspect --format '{{.Config.Image}}' polyglot_landing 2>/dev/null)"
            } > PREVIOUS_RELEASE 2>/dev/null || true

            docker compose pull

            docker network create polyglot-network 2>/dev/null || true

            docker compose --profile tools run --rm migrate

            docker compose run --rm admin-api node apps/admin-api/dist/seed.js

            # One-off data repair (see repair-native-translations.cli.ts): puts
            # back the native translations background enrichment deleted. Runs on
            # both environments so nobody has to hold a production connection
            # string; a repaired database makes it a no-op. Remove this step and
            # the CLI once dev and prod have both run it.
            docker compose run --rm --no-deps bot node apps/bot/dist/repair-native-translations.cli.js

            # Dev only: wipe the configured tester accounts from the freshly
            # branched production data. The CLI itself refuses to run unless
            # POLYGLOT_ENV=development, so a stray call on prod is a no-op error.
            if [ "$DEPLOY_ENV" = "development" ]; then
              docker compose run --rm --no-deps \
                -e POLYGLOT_ENV=development -e DEV_RESET_USERS="$DEV_RESET_USERS" \
                bot node apps/bot/dist/dev-reset-users.cli.js
            fi

            docker compose up -d --remove-orphans

            # Health gate (T13): fail the deploy if any container does not become
            # healthy, so a crash-loop turns the workflow RED instead of silently
            # shipping a broken release. Runs before prune, so a failed gate keeps
            # the previous image available for rollback.
            gate_service() {
              name="$1"
              deadline=$((SECONDS + 180))
              while true; do
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$name" 2>/dev/null || echo missing)
                case "$status" in
                  healthy) echo "OK: $name healthy"; return 0 ;;
                  none) echo "SKIP: $name has no healthcheck"; return 0 ;;
                  missing) echo "FAIL: $name not found"; return 1 ;;
                  unhealthy) echo "FAIL: $name unhealthy"; docker logs --tail=120 "$name" 2>&1 || true; return 1 ;;
                esac
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "FAIL: timed out waiting for $name (last status: $status)"
                  docker logs --tail=120 "$name" 2>&1 || true
                  return 1
                fi
                sleep 5
              done
            }

            for svc in polyglot_bot polyglot_admin_api polyglot_admin polyglot_landing; do
              gate_service "$svc" || { echo "Deploy health gate FAILED for $svc"; exit 1; }
            done

            # Readiness probe (T12 /readyz): confirms the DB is reachable and
            # long-polling is live, not just that the process is up.
            if ! curl -fsS --max-time 5 "http://127.0.0.1:${METRICS_PORT:-9090}/readyz"; then
              echo "FAIL: bot /readyz not ready"
              docker logs --tail=120 polyglot_bot 2>&1 || true
              exit 1
            fi
            echo "OK: bot /readyz ready"

            if grep -q '^RELEASE_ANNOUNCEMENT_BASE64=.' .env; then
              docker compose run --rm --no-deps bot node apps/bot/dist/release-announcement.cli.js
            else
              echo "no announcement content"
            fi

            # Keep exactly two releases: what is running now and what
            # PREVIOUS_RELEASE names for rollback. Age is the wrong bound — each
            # release is ~3.3 GB (bot, admin, admin-api, migrate), so the old
            # `until=168h` filter let a few develop pushes a day fill the 20 GB dev
            # disk within a day, and the next deploy died copying files onto it
            # (2026-09-13). `prune -af` was worse: it deleted the rollback image.
            keep=" $(cut -d= -f2 PREVIOUS_RELEASE 2>/dev/null | tr '\n' ' ') $(docker ps -a --format '{{.Image}}' | tr '\n' ' ') "
            docker images --format '{{.Repository}}:{{.Tag}}' | while read -r image; do
              case "$keep" in
                *" $image "*) ;;
                *) docker rmi "$image" >/dev/null 2>&1 || true ;;
              esac
            done
            docker image prune -f
            docker builder prune -af 2>/dev/null || true

      # Only after the deploy succeeded: a failed run keeps the previous branch
      # (and the stack still running on it) intact for debugging. Leaked
      # branches from failed runs are swept by the next successful one.
      - name: Prune previous dev database branches
        if: env.DEPLOY_ENV == 'development'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          auth=(-H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json")
          curl -fsS "${auth[@]}" "${api}/branches" \
            | jq -r --arg keep "$DEV_DB_BRANCH_ID" '.branches[] | select(.name | startswith("dev/")) | select(.id != $keep) | .id' \
            | while read -r id; do
                echo "Deleting stale dev branch ${id}"
                curl -fsS "${auth[@]}" -X DELETE "${api}/branches/${id}" >/dev/null
              done
