name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm lint

      - name: Dependency cruiser
        run: pnpm lint:deps

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Generate test coverage catalog
        run: pnpm test:catalog

      - name: Upload test coverage catalog
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-catalog
          path: |
            apps/admin/public/reports/test-catalog.json
            apps/admin/public/reports/test-catalog.html
