name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

permissions:
  contents: read

# NOTE: inside a workflow_call invocation the `github` context belongs to the
# CALLER, so when deploy.yml invokes this workflow the group below resolves to
# "Deploy to VPS-refs/heads/master". cancel-in-progress must therefore be false
# on master: cancelling the CI gate of an in-flight production deploy would fail
# `needs: ci` and kill the release. On develop, collapsing superseded runs is
# exactly what we want. Push and pull_request runs land in different groups
# (refs/heads/develop vs refs/pull/N/merge) and so never cancel each other —
# intentional, since the PR run is the release gate on the merge commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26 # prod parity: .nvmrc=26, all deploy/Dockerfile* use node:26-alpine
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm lint

      - name: Dependency cruiser
        run: pnpm lint:deps

      - name: Build
        run: pnpm build

      # Ordered after Build to match CLAUDE.md's gate (build -> lint -> lint:deps
      # -> lint:knip -> test) and because knip resolves workspace deps through
      # package.json `exports`, which point at ./dist/*.d.ts.
      - name: Knip
        run: pnpm lint:knip

      # Migration folder/journal consistency ONLY. This does NOT detect schema
      # drift: drizzle-kit check passes on a schema.ts table that exists in no
      # migration. It is also DB-independent — it passes against an unreachable
      # DATABASE_URL and only needs the variable set, because drizzle.config.ts
      # throws when it is absent. Hence the placeholder and the placement here
      # rather than in the integration job.
      - name: Migration journal consistency
        run: pnpm db:check
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused

      # The check that actually catches drift: editing schema.ts without running
      # db:generate. Re-generating and finding no new files is the only way to
      # prove the migrations match the schema.
      - name: Schema drift (schema.ts vs migrations)
        run: |
          pnpm db:generate
          # `git status --porcelain`, not `git diff`: db:generate writes a new
          # .sql and a new meta/*_snapshot.json as UNTRACKED files, which
          # `git diff` cannot see at all.
          if [ -n "$(git status --porcelain -- packages/adapters/db/drizzle)" ]; then
            echo "::error::schema.ts changed with no generated migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- packages/adapters/db/drizzle
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused

      - name: Tests
        run: pnpm test

      - name: Generate test coverage catalog
        run: pnpm test:catalog

      - name: Upload test coverage catalog
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-catalog
          path: |
            apps/admin/reports-data/test-catalog.json
            apps/admin/reports-data/test-catalog.html

  # Real-DB integration lane (Task 71). CI supplies a throwaway Postgres service
  # container via TEST_DATABASE_URL and hands it to `pnpm test:integration`, the
  # single entry point developers use too — it migrates, seeds and runs. A service
  # container is free runner-local compute, so the lane deliberately consumes ZERO
  # Neon compute-hours on every develop push (Neon bills by compute time). The same
  # script provisions a database on its own when none is supplied: an ephemeral
  # Neon branch with NEON_API_KEY/NEON_PROJECT_ID, otherwise a private local
  # cluster, so a fresh checkout or git worktree needs no setup at all.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polyglot_test
        ports:
          - 5432:5432
        # Job steps run on the host, so wait until the mapped port is genuinely ready.
        options: >-
          --health-cmd "pg_isready -U postgres -d polyglot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway, runner-local, torn down with the job — safe to inline.
      CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polyglot_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the workspace so the bot e2e tests resolve @polyglot/* from dist
      # (the same posture the `check` job's tests rely on).
      - name: Build
        run: pnpm build

      # One command, same as a developer runs locally: seeing TEST_DATABASE_URL
      # already set, the script skips provisioning entirely and applies the
      # migrations (the prod path, including the languages data-seed) plus the
      # bootstrap seed to the service container before running the lane. Keeping
      # CI on the same entry point is what stops the two from drifting.
      - name: Integration tests (migrate + seed + run)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
