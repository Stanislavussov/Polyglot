# nginx config baked into the landing container (deploy/Dockerfile.landing).
# Serves the static Astro `dist/` on port 80. Public TLS + host routing for
# polyglot.monster is handled by the host nginx in deploy/ansible/site.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Long-cache fingerprinted assets. `^~` so this prefix wins over the
    # regex asset location below (nginx ranks regex above plain prefixes).
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
