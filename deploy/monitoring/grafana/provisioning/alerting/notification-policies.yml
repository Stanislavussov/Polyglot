apiVersion: 1

# Route every alert to the Telegram contact point. group_by keeps related
# alerts in one message; repeat_interval avoids alert-storm spam.
policies:
  - orgId: 1
    receiver: polyglot-telegram
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
