apiVersion: 1

# Provisioned alert rules (Fable T12). The metrics already exist — these rules
# turn them into notifications so a silent freeze (like the 429 incident) is
# noticed. All route to the polyglot-telegram contact point.
groups:
  - orgId: 1
    name: polyglot-bot
    folder: Polyglot Alerts
    interval: 1m
    rules:
      # 1. The bot's Prometheus target is down (process crashed / unreachable).
      #    This is the sole liveness alert: up==0 fires only when the process is
      #    actually down/unreachable, so it never false-pages on an idle bot.
      #    noDataState: OK avoids paging on a transient Prometheus scrape gap.
      - uid: polyglot_bot_down
        title: Bot is down
        condition: C
        for: 2m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: The bot's metrics endpoint has been unreachable for 2m.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up{job="bot"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # 2. (Removed) "No Telegram updates for 10m" — message volume was a poor
      #    liveness proxy: with an MVP-sized user base the bot is legitimately
      #    idle most of the time, so sum(increase(bot_telegram_messages_total))
      #    sits at 0 and the rule false-fired constantly. Real process liveness
      #    is already covered by rule #1 (Bot is down, up==0). A hung-but-alive
      #    poll loop can't be distinguished from normal silence at this traffic
      #    level; if that becomes a concern, add a dedicated poll-cycle heartbeat
      #    counter in the bot and alert on rate(heartbeat)==0 instead.
      #
      #    Deleting it from this file did NOT remove it (Task 78) — it kept
      #    firing critical ~6x/day. Grafana's file provisioning is
      #    create/update-only: it ignores rules a file no longer mentions, so a
      #    rule already in the database survives its own deletion. The
      #    `deleteRules:` block at the bottom is what actually removes it; keep
      #    it.

      # 3. Translation failure RATIO is elevated (AI provider failing, e.g. 429).
      #    noDataState: OK + `or vector(0)` because the status="error" series
      #    does not exist until the first error ever occurs; without this the
      #    rule evaluates to NoData and false-fires DatasourceNoData while the
      #    bot is perfectly healthy (zero errors).
      #
      #    Task 78 — this was an absolute rate (`> 0.05`/s, ~15 errors per 5m
      #    window) against measured lifetime traffic of FOUR translations. It
      #    could not fire, and stayed `normal` throughout the 2026-08-22 credit
      #    outage while every AI call was failing.
      #
      #    A ratio is traffic-independent. `clamp_min(..., 0.0001)` stops an idle
      #    bot dividing zero by zero; the floor is well under one event per
      #    window (1/1800s = 0.00055/s) so it never distorts a real ratio.
      #    `for: 15m` over 30m because at this volume one failure is a large
      #    fraction of a small denominator.
      #
      #    Stays `warning` — evaluated and visible, never messaged. The paging
      #    signal for an AI outage is rule #8.
      - uid: polyglot_bot_translation_errors
        title: Elevated translation failure ratio
        condition: C
        for: 15m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: More than half of translation attempts have failed over the last 30m (AI provider may be failing).
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (sum(rate(bot_translations_total{status="error"}[30m])) or vector(0)) / clamp_min(sum(rate(bot_translations_total[30m])) or vector(0), 0.0001)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]

      # 4. Self-healing Phase 1d: bot restart loop (autoheal or Docker itself is
      #    repeatedly restarting the container — the container-level analogue of
      #    the 2026-07-01 model-freeze incident, where the process stayed up but
      #    wedged). Metric source: cAdvisor's `container_start_time_seconds`,
      #    selected by the `name` label — already scraped by this stack's
      #    cadvisor job (prometheus.yml) and already used with the same `name`
      #    label throughout the provisioned Docker dashboard (e.g.
      #    `container_last_seen{name=~".+"}`), so `name="polyglot_bot"` is a
      #    proven-working selector here, not a guess. `changes(...)` counts
      #    process-start-time jumps within the window — each restart (whether
      #    triggered by autoheal's /restart call or a plain crash) bumps the
      #    start time, so >3 changes in 15m means a loop, not one-off recovery.
      #    (Alternative source, not used: the Phase 1a `bot_boot_total` counter
      #    via `increase(bot_boot_total[15m]) > 3` — also valid, but the
      #    cAdvisor signal was chosen since it observes restarts from outside
      #    the process, so it still fires if the process fails to boot far
      #    enough to increment its own counter.)
      - uid: polyglot_bot_restart_loop
        title: Bot restart loop detected
        condition: C
        for: 0m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: The bot container has restarted more than 3 times in the last 15m (possible crash loop).
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: changes(container_start_time_seconds{name="polyglot_bot"}[15m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]

      # 5. Self-healing Phase 3: an AI model's circuit breaker is open. The breaker
      #    trips after repeated retriable provider failures and fast-fails requests
      #    (routing to the fallback, or refusing outright when both are down) instead
      #    of hammering a provider that is already failing — the direct successor to
      #    the 2026-07-01 model-freeze incident. Gauge encoding: 0=closed,
      #    1=half-open, 2=open, so `> 1` fires only on a fully-open breaker (a
      #    half-open probe window is a normal recovery step, not a page). `max(...)`
      #    collapses the per-model series to "is ANY model open"; `or vector(0)` +
      #    noDataState: OK because the series does not exist until the first
      #    transition ever occurs (identical rationale to rule #3).
      - uid: polyglot_bot_circuit_open
        title: AI model circuit breaker open
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: An AI model's circuit breaker has been open for 5m (provider failing; requests are being fast-failed).
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(bot_ai_circuit_state) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]

      # 6. Self-healing Phase 4: host disk is running low (warning). The whole
      #    stack shares one VPS with a single root filesystem, and the monitoring
      #    bind-mounts live under /opt/monitoring/data/* on it, so an unbounded
      #    log/metric spill can fill the disk and take down EVERYTHING. Metric
      #    source: node-exporter's `node_filesystem_*` (already scraped by this
      #    stack's node-exporter job, prometheus.yml). node-exporter runs with
      #    `--path.rootfs=/host` (docker-compose.monitoring.yml), which strips the
      #    /host prefix so the host root reports as `mountpoint="/"` — the exact
      #    selector `{mountpoint="/", fstype!="rootfs"}` used by this stack's
      #    provisioned Host dashboard root-FS gauge (host.json), so it is a
      #    proven-working selector here, not a guess. `fstype!="rootfs"` drops the
      #    legacy pseudo-fs; `mountpoint="/"` targets the real data filesystem
      #    (single VPS, /opt is not a separate mount). Ratio of avail/size < 0.15
      #    = under 15% free. No `or vector(0)` needed (node-exporter always
      #    reports these series); noDataState: OK matches the siblings and avoids
      #    paging on a transient scrape gap.
      - uid: polyglot_host_disk_low
        title: Host disk space low
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: warning
        annotations:
          summary: The host root filesystem has less than 15% free space (log/metric growth may fill the disk).
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.15]

      # 7. Self-healing Phase 4: host disk is critically low (critical). Same
      #    metric/selector rationale as rule #6, tighter threshold: avail/size
      #    < 0.05 = under 5% free, the point at which writes start failing and
      #    the stack is at imminent risk. Kept as a separate rule (mirrors the
      #    siblings' one-threshold-per-rule pattern) so warning and critical page
      #    distinctly.
      - uid: polyglot_host_disk_critical
        title: Host disk space critical
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: The host root filesystem has less than 5% free space (writes may start failing; the whole stack is at risk).
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.05]

      # 8. Task 78: the OpenRouter key is near its spend limit — the alert whose
      #    absence caused the 2026-08-22 outage (key hit its $1 cap, every AI
      #    call failed, nothing fired).
      #
      #    A gauge, not a log-scrape of the provider's "Key limit exceeded"
      #    text: that text only appears once the outage has started, while the
      #    gauge crosses 0.9 with translation still working. Source:
      #    apps/bot/src/ai-credit.wiring.ts.
      #
      #    Both gauges are absent for a key with no spend limit, hence
      #    `or vector(0)` + noDataState: OK, as in rules #3 and #5. clamp_min
      #    only guards a provider returning limit=0.
      - uid: polyglot_ai_credit_exhausted
        title: AI credit nearly exhausted
        condition: C
        for: 5m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: The OpenRouter key has used more than 90% of its spend limit. At 100% every AI call fails instantly and translation goes fully down.
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (sum(bot_ai_credit_usage_usd) / clamp_min(sum(bot_ai_credit_limit_usd), 0.0001)) or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]

      # 9. Task 78: scheduled notifications are failing to reach users. Critical
      #    rather than warning — a bot that cannot deliver its cards is down in
      #    the only sense a user notices, even while `up==1`.
      #
      #    Written only against status values the code actually emits
      #    (notification.wiring.ts). Blocked users are counted separately as
      #    `delivery_blocked` and excluded here: they accrue on a healthy bot,
      #    so including them would page for normal churn.
      #
      #    A ratio for the same low-traffic reason as rule #3. `or vector(0)` +
      #    noDataState: OK because neither series exists until the first send.
      - uid: polyglot_bot_notification_failures
        title: Notification delivery failing
        condition: C
        for: 15m
        noDataState: OK
        labels:
          severity: critical
        annotations:
          summary: More than half of scheduled notification sends have failed over the last 30m (users are not receiving their cards).
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (sum(rate(bot_notifications_total{status="delivery_failed"}[30m])) or vector(0)) / clamp_min(sum(rate(bot_notifications_total{status=~"delivery_sent|delivery_failed"}[30m])) or vector(0), 0.0001)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]

# Rules to remove from the running instance.
#
# Grafana file provisioning is create/update-only: deleting a rule's YAML does
# not delete the rule. This is the only mechanism that does. Entries are
# idempotent and meant to stay — see the obituary at #2.
deleteRules:
  - orgId: 1
    uid: polyglot_bot_update_silence
