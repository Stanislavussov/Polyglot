apiVersion: 1

# Where firing alerts are delivered. Configured via env so no secret is
# committed: set GRAFANA_ALERT_TELEGRAM_BOTTOKEN and GRAFANA_ALERT_TELEGRAM_CHATID
# in the monitoring stack's environment (documented in .env.example).
contactPoints:
  - orgId: 1
    name: polyglot-telegram
    receivers:
      - uid: polyglot_telegram
        type: telegram
        disableResolveMessage: false
        settings:
          # bottoken stays in env (it is the real secret and is non-numeric, so
          # it substitutes cleanly). chatid is hardcoded as a literal string on
          # purpose: Grafana 11.x expands $__env{} AFTER YAML parsing and then
          # re-types the result, so a numeric chat id comes back as a JSON number
          # and provisioning dies with "cannot unmarshal number into Go struct
          # field Config.chatid of type string" — crash-looping the whole
          # container. YAML quoting does NOT fix it (confirmed: grafana/grafana
          # #69950). A chat id is not a credential (useless without the bot
          # token), so committing it as a literal is safe and sidesteps the bug.
          bottoken: "$__env{GRAFANA_ALERT_TELEGRAM_BOTTOKEN}"
          chatid: "368249477"
