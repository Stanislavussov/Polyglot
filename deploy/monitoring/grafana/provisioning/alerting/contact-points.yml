apiVersion: 1

# Where firing alerts are delivered. Configured via env so no secret is
# committed: set GRAFANA_ALERT_TELEGRAM_BOTTOKEN and GRAFANA_ALERT_TELEGRAM_CHATID
# in the monitoring stack's environment (documented in .env.example).
contactPoints:
  - orgId: 1
    name: polyglot-telegram
    receivers:
      - uid: polyglot_telegram
        type: telegram
        disableResolveMessage: false
        settings:
          # Quoted so the env-substituted values are always parsed as strings.
          # A Telegram chat id is numeric (e.g. -1001234567890); unquoted, YAML
          # parses it as a number and Grafana fails provisioning with
          # "cannot unmarshal number into Go struct field Config.chatid of type
          # string", crash-looping the whole container.
          bottoken: "$__env{GRAFANA_ALERT_TELEGRAM_BOTTOKEN}"
          chatid: "$__env{GRAFANA_ALERT_TELEGRAM_CHATID}"
