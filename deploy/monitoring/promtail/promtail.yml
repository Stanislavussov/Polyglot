server:
  http_listen_port: 9080

# Persist read positions on a mounted volume, not the container's ephemeral
# /tmp (Fable T30, F8) — otherwise every restart re-reads log files from the
# start and duplicates log lines in Loki. Backed by /opt/monitoring/data/promtail.
positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container_name
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
      - labels:
          level:
