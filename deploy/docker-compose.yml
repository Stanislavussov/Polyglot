services:
  bot:
    image: ${BOT_IMAGE_NAME:?BOT_IMAGE_NAME is required}
    container_name: polyglot_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - METRICS_PORT=9090
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${MIGRATE_IMAGE_NAME:?MIGRATE_IMAGE_NAME is required}
    profiles:
      - tools
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"
    mem_limit: 256m

  admin-api:
    image: ${ADMIN_API_IMAGE_NAME:?ADMIN_API_IMAGE_NAME is required}
    container_name: polyglot_admin_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:?ADMIN_PANEL_URL is required}
      - PORT=3001
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-3001}:3001"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    image: ${ADMIN_IMAGE_NAME:?ADMIN_IMAGE_NAME is required}
    container_name: polyglot_admin
    restart: unless-stopped
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_API_URL=${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      # Server-to-server URL used by the SSR reports middleware to verify the
      # admin token via admin-api /api/auth/me (over the compose network).
      - ADMIN_API_INTERNAL_URL=http://admin-api:3001
    ports:
      - "127.0.0.1:${ADMIN_PORT:-4321}:4321"
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    image: ${LANDING_IMAGE_NAME:?LANDING_IMAGE_NAME is required}
    container_name: polyglot_landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: polyglot-network
    external: true
