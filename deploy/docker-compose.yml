services:
  bot:
    image: ${BOT_IMAGE_NAME:?BOT_IMAGE_NAME is required}
    container_name: polyglot_bot
    restart: unless-stopped
    # Secrets are scoped per service (Fable T30, F7): the bot no longer loads the
    # whole shared `.env` (which also carries the admin-api JWT_SECRET, admin
    # URLs, etc.). It receives only the variables it actually reads, so a bot
    # compromise cannot leak another service's secrets. Values interpolate from
    # the compose-directory `.env`.
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - METRICS_PORT=9090
      - BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN is required}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      # Consumed by the release-announcement CLI (`docker compose run bot …`) on
      # deploy; empty when a release has no changelog notes.
      - RELEASE_ID=${RELEASE_ID:-}
      - RELEASE_AUDIENCE_GROUPS=${RELEASE_AUDIENCE_GROUPS:-}
      - RELEASE_ANNOUNCEMENT_BASE64=${RELEASE_ANNOUNCEMENT_BASE64:-}
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    # Healthcheck is baked into the image (deploy/Dockerfile HEALTHCHECK), single
    # source of truth (Fable T30, F10) — matches admin/admin-api which also rely
    # on the image-level healthcheck. The image HEALTHCHECK now probes /livez, so
    # a wedged/dead runner turns the container `unhealthy` and the autoheal
    # service (below) restarts it. Only the bot is labelled; admin-api/admin/
    # landing have no liveness-grade healthcheck and are intentionally left out.
    labels:
      - "autoheal=true"
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${MIGRATE_IMAGE_NAME:?MIGRATE_IMAGE_NAME is required}
    profiles:
      - tools
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  admin-api:
    image: ${ADMIN_API_IMAGE_NAME:?ADMIN_API_IMAGE_NAME is required}
    container_name: polyglot_admin_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:?ADMIN_PANEL_URL is required}
      - PORT=3001
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-3001}:3001"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    image: ${ADMIN_IMAGE_NAME:?ADMIN_IMAGE_NAME is required}
    container_name: polyglot_admin
    restart: unless-stopped
    depends_on:
      admin-api:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_API_URL=${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      # Server-to-server URL used by the SSR reports middleware to verify the
      # admin token via admin-api /api/auth/me (over the compose network).
      - ADMIN_API_INTERNAL_URL=http://admin-api:3001
    ports:
      - "127.0.0.1:${ADMIN_PORT:-4321}:4321"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  landing:
    image: ${LANDING_IMAGE_NAME:?LANDING_IMAGE_NAME is required}
    container_name: polyglot_landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT:-8080}:80"
    # Healthcheck is baked into the image (deploy/Dockerfile.landing HEALTHCHECK),
    # single source of truth (Fable T30, F10).
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Self-healing Phase 1c ────────────────────────────────────────────
  # Container auto-restart for the bot when its /livez healthcheck fails.
  # autoheal never touches the raw Docker socket: it talks only to the
  # wollomatic socket-proxy over an internal-only network, and the proxy
  # exposes exactly two gated Docker API calls (list + restart) — nothing
  # can create/kill/stop/exec, because those paths simply don't match the
  # allow-regex and are denied by non-match (default-deny).
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.12.2
    container_name: polyglot_docker_socket_proxy
    restart: unless-stopped
    # Distroless nonroot image (USER 65534). GID 999 is the `docker` group on
    # the Ubuntu docker-ce host (provisioned by deploy/ansible/site.yml) and is
    # required to READ the root:docker-owned socket. If `getent group docker`
    # on the host ever reports a different GID, update this value.
    user: "65534:999"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    command:
      - "-loglevel=info"
      # Listen on all interfaces so autoheal can reach it over the internal
      # network (the default 127.0.0.1 would only serve localhost).
      - "-listenip=0.0.0.0"
      # Only the autoheal container may connect (resolved via Docker DNS).
      - "-allowfrom=autoheal"
      # Auto-anchored ^...$ against r.URL.Path (query string stripped). autoheal
      # lists unhealthy containers via GET /containers/json?filters=... — path is
      # /containers/json. The optional (v[\d.]+/)? tolerates an API-version
      # prefix (e.g. /v1.44/) though autoheal does not send one.
      - "-allowGET=/(v[\\d.]+/)?containers/json"
      # autoheal restarts via POST /containers/<id>/restart?t=<timeout> — path is
      # /containers/<id>/restart. <id> is a container ID or name.
      - "-allowPOST=/(v[\\d.]+/)?containers/[a-zA-Z0-9_.-]+/restart"
    volumes:
      # Read-only mount — the ONLY place the real socket is exposed.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxynet
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: polyglot_autoheal
    restart: unless-stopped
    # Defense-in-depth (symmetry with the proxy's hardening): autoheal holds no
    # socket and only reaches the Docker API through the gated proxy, so this
    # is not fixing an exploit path. `read_only` is deliberately NOT set here —
    # unlike the proxy, autoheal's entrypoint is unverified against a read-only
    # rootfs and may need to write (e.g. temp/log files).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Talk to the Docker API only through the gated proxy — never the raw
      # socket (no /var/run/docker.sock mount here by design).
      - DOCKER_SOCK=tcp://docker-socket-proxy:2375
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    networks:
      # autoheal only needs the proxy connection; the proxy talks to the daemon
      # over the mounted socket, and the daemon can restart the bot regardless of
      # which network the bot is on — so autoheal stays off polyglot-network.
      - docker-proxynet
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: polyglot-network
    external: true
  # Internal-only (no host/external route): nothing outside can reach the
  # Docker-API proxy. Only docker-socket-proxy + autoheal are attached here;
  # the app services stay on polyglot-network as before.
  docker-proxynet:
    internal: true
