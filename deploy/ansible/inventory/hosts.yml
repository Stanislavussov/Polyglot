---
polyglot:
  hosts:
    vps-server:
      ansible_host: "{{ lookup('env', 'VPS_HOST') }}"
      ansible_user: "{{ lookup('env', 'VPS_USER') | default('root', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'VPS_SSH_KEY') }}"
      ansible_port: "{{ lookup('env', 'VPS_SSH_PORT') | default(22, true) }}"
