---
# Prepare Ubuntu VPS for Docker + deploy Polyglot bot
#
# Usage:
#   ansible-playbook -i inventory/hosts site.yml
#
- name: Setup Docker on Ubuntu VPS
  hosts: polyglot
  become: true

  tasks:
    # ─── Ensure SSH is allowed through UFW ──────────────────────────
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    # ─── Install Docker via official script ─────────────────────────
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # ─── Install Git (for cloning repo) ─────────────────────────────
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present

    # ─── Verify ──────────────────────────────────────────────────────
    - name: Verify Docker
      ansible.builtin.command: docker compose version
      changed_when: false
      register: result

    - name: Show version
      ansible.builtin.debug:
        msg: "{{ result.stdout }}"
