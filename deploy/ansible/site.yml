---
- name: Harden Ubuntu VPS
  hosts: polyglot
  become: true
  gather_facts: true

  vars:
    deploy_user: deploy
    admin_panel_domain: "{{ lookup('env', 'ADMIN_PANEL_DOMAIN') }}"
    admin_api_domain: "{{ lookup('env', 'ADMIN_API_DOMAIN') }}"
    grafana_domain: "{{ lookup('env', 'GRAFANA_DOMAIN') }}"
    acme_email: "{{ lookup('env', 'ACME_EMAIL') }}"
    configure_public_routing: "{{ admin_panel_domain | length > 0 and admin_api_domain | length > 0 }}"
    configure_grafana_routing: "{{ grafana_domain | length > 0 }}"
    landing_domain: "{{ lookup('env', 'LANDING_DOMAIN') }}"
    landing_www_domain: "{{ lookup('env', 'LANDING_WWW_DOMAIN') }}"
    landing_port: "{{ lookup('env', 'LANDING_PORT') | default('8080', true) }}"
    configure_landing_routing: "{{ landing_domain | length > 0 }}"

  tasks:
    - name: Install essential packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - curl
          - gnupg
          - ca-certificates
          - cron
        state: present
        update_cache: true

    - name: Configure UFW
      community.general.ufw:
        state: enabled
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ansible_port | default(22) }}"
        proto: tcp

    - name: Allow HTTP/HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: [80, 443]

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true

    - name: Create .ssh directory
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.ssh"
        owner: "{{ deploy_user }}"
        mode: '0700'
        state: directory

    - name: Add SSH key
      ansible.builtin.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('env', 'DEPLOY_USER_SSH_KEY') }}"
      when: lookup('env', 'DEPLOY_USER_SSH_KEY') | length > 0

    - name: SSH hardening
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.key }}"
        line: "{{ item.key }} {{ item.value }}"
        create: true
        mode: '0644'
      loop:
        - { key: 'PermitRootLogin', value: 'no' }
        - { key: 'PasswordAuthentication', value: 'no' }
        - { key: 'PermitEmptyPasswords', value: 'no' }
        - { key: 'MaxAuthTries', value: '3' }
      notify: Restart ssh

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Create /opt/polyglot directory
      ansible.builtin.file:
        path: /opt/polyglot
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0755'
        state: directory

    - name: Allow deploy user to cleanup old deployments
      ansible.builtin.copy:
        content: |
          # Deploy cleanup - allows CI to rm -rf old polyglot dirs
          {{ deploy_user }} ALL=(root) NOPASSWD: /bin/rm -rf /opt/polyglot_old
        dest: /etc/sudoers.d/deploy-user-polyglot
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Install admin seed helper
      ansible.builtin.copy:
        dest: /usr/local/bin/polyglot-admin-seed
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"

          cd /opt/polyglot
          docker compose exec -T \
            -e ADMIN_EMAIL="${ADMIN_EMAIL}" \
            -e ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            admin-api \
            node apps/admin-api/dist/seed.js

    - name: Create Docker network for cross-compose communication
      ansible.builtin.shell: docker network create polyglot-network 2>/dev/null || true
      changed_when: false

    - name: Create monitoring data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner | default(deploy_user) }}"
        group: "{{ item.group | default(deploy_user) }}"
        mode: '0755'
        state: directory
      loop:
        - { path: /opt/monitoring }
        - { path: /opt/monitoring/data }
        - { path: /opt/monitoring/data/prometheus, owner: "65534", group: "65534" }
        - { path: /opt/monitoring/data/grafana, owner: "472", group: "472" }
        - { path: /opt/monitoring/data/loki, owner: "10001", group: "10001" }

    - name: Install public routing packages
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true
      when: configure_public_routing | bool

    # ── Edge hardening (Fable T20, findings F5/S10) ──
    # nginx must be present before writing the shared snippet/conf.d files so
    # `nginx -t` (which reads them via the http-context includes) passes. Landing
    # installs nginx later in the play, so ensure it here for landing-only hosts.
    - name: Ensure nginx present for edge hardening
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: configure_public_routing | bool or configure_landing_routing | bool

    - name: Deploy nginx hardening includes (TLS, security headers, login rate limit)
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
        content: "{{ item.content }}"
      loop:
        - dest: /etc/nginx/conf.d/polyglot-tls.conf
          content: |
            # TLS hardening — Mozilla "intermediate" (Fable T20, F5). http context,
            # so every ssl server (admin, grafana, landing) inherits it without
            # per-server duplication or duplicate shared-zone definitions.
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers off;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
            ssl_session_timeout 1d;
            ssl_session_cache shared:PolyglotSSL:10m;
            ssl_session_tickets off;
        - dest: /etc/nginx/conf.d/polyglot-limits.conf
          content: |
            # Login rate-limit zone (Fable T20/T05) — 5 req/min per client IP,
            # edge-level defense-in-depth in front of the app's own limiter.
            limit_req_zone $binary_remote_addr zone=polyglot_login:10m rate=5r/m;
        - dest: /etc/nginx/snippets/polyglot-hardening.conf
          content: |
            # Security response headers + request/proxy limits (Fable T20, F5).
            # Included per TLS server block (HSTS must not be emitted over plain HTTP).
            add_header Strict-Transport-Security "max-age=63072000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            client_max_body_size 10m;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
      when: configure_public_routing | bool or configure_landing_routing | bool
      notify: Reload nginx

    - name: Check admin TLS certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ admin_panel_domain }}/fullchain.pem"
      register: admin_tls_certificate
      when: configure_public_routing | bool

    - name: Check Grafana TLS certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ grafana_domain }}/fullchain.pem"
      register: grafana_tls_certificate
      when: configure_grafana_routing | bool

    - name: Configure nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/polyglot
        owner: root
        group: root
        mode: '0644'
        content: |
          {% if admin_tls_certificate.stat.exists | default(false) %}
          server {
              listen 80;
              server_name {{ admin_panel_domain }} {{ admin_api_domain }};

              location / {
                  return 301 https://$host$request_uri;
              }
          }
          {% if grafana_tls_certificate.stat.exists | default(false) %}

          server {
              listen 80;
              server_name {{ grafana_domain }};

              location / {
                  return 301 https://$host$request_uri;
              }
          }
          {% elif grafana_domain | length > 0 %}

          server {
              listen 80;
              server_name {{ grafana_domain }};

              # Pre-TLS bootstrap: never expose the Grafana login over plain HTTP
              # (S10). certbot --nginx layers the ACME HTTP-01 challenge on top.
              location / {
                  return 503;
              }
          }
          {% endif %}

          server {
              listen 443 ssl http2;
              server_name {{ admin_panel_domain }};

              ssl_certificate /etc/letsencrypt/live/{{ admin_panel_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ admin_panel_domain }}/privkey.pem;

              include /etc/nginx/snippets/polyglot-hardening.conf;

              location / {
                  proxy_pass http://localhost:4321;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

          server {
              listen 443 ssl http2;
              server_name {{ admin_api_domain }};

              ssl_certificate /etc/letsencrypt/live/{{ admin_panel_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ admin_panel_domain }}/privkey.pem;

              include /etc/nginx/snippets/polyglot-hardening.conf;

              # Edge rate-limit on the admin login endpoint (T20/T05).
              location = /api/auth/login {
                  limit_req zone=polyglot_login burst=5 nodelay;
                  proxy_pass http://localhost:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  proxy_pass http://localhost:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          {% if grafana_tls_certificate.stat.exists | default(false) %}

          server {
              listen 443 ssl http2;
              server_name {{ grafana_domain }};

              ssl_certificate /etc/letsencrypt/live/{{ grafana_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ grafana_domain }}/privkey.pem;

              include /etc/nginx/snippets/polyglot-hardening.conf;

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
          {% endif %}
          {% else %}
          # Pre-TLS bootstrap: the admin panel, admin API and Grafana all serve
          # login UIs and must never be exposed over plain HTTP (S10). Return 503
          # until certbot issues the certificate; certbot --nginx layers the ACME
          # HTTP-01 challenge on top, after which the TLS server blocks above serve.
          server {
              listen 80;
              server_name {{ admin_panel_domain }} {{ admin_api_domain }}{% if grafana_domain | length > 0 %} {{ grafana_domain }}{% endif %};

              location / {
                  return 503;
              }
          }
          {% endif %}
      when: configure_public_routing | bool
      notify: Reload nginx

    - name: Enable nginx reverse proxy site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/polyglot
        dest: /etc/nginx/sites-enabled/polyglot
        state: link
      when: configure_public_routing | bool
      notify: Reload nginx

    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      when: configure_public_routing | bool
      notify: Reload nginx

    - name: Validate nginx config
      ansible.builtin.command: nginx -t
      changed_when: false
      when: configure_public_routing | bool

    - name: Start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      when: configure_public_routing | bool

    - name: Issue TLS certificates
      ansible.builtin.command:
        cmd: >-
          certbot --nginx --non-interactive --agree-tos
          --email {{ acme_email }}
          -d {{ admin_panel_domain }}
          -d {{ admin_api_domain }}
        creates: "/etc/letsencrypt/live/{{ admin_panel_domain }}/fullchain.pem"
      when:
        - configure_public_routing | bool
        - acme_email | length > 0

    - name: Issue Grafana TLS certificate
      ansible.builtin.command:
        cmd: >-
          certbot --nginx --non-interactive --agree-tos
          --email {{ acme_email }}
          -d {{ grafana_domain }}
        creates: "/etc/letsencrypt/live/{{ grafana_domain }}/fullchain.pem"
      when:
        - configure_grafana_routing | bool
        - acme_email | length > 0

    # ── Landing site (polyglot.monster) — separate nginx site, admin routing untouched ──
    - name: Install public routing packages (landing)
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true
      when: configure_landing_routing | bool

    - name: Check landing TLS certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ landing_domain }}/fullchain.pem"
      register: landing_tls_certificate
      when: configure_landing_routing | bool

    - name: Configure nginx for the landing site
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/polyglot-landing
        owner: root
        group: root
        mode: '0644'
        content: |
          {% if landing_tls_certificate.stat.exists | default(false) %}
          # HTTP → HTTPS
          server {
              listen 80;
              server_name {{ landing_domain }}{% if landing_www_domain | length > 0 %} {{ landing_www_domain }}{% endif %};

              location / {
                  return 301 https://{{ landing_domain }}$request_uri;
              }
          }

          {% if landing_www_domain | length > 0 %}
          # www → apex (HTTPS)
          server {
              listen 443 ssl http2;
              server_name {{ landing_www_domain }};

              ssl_certificate /etc/letsencrypt/live/{{ landing_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ landing_domain }}/privkey.pem;

              return 301 https://{{ landing_domain }}$request_uri;
          }
          {% endif %}

          server {
              listen 443 ssl http2;
              server_name {{ landing_domain }};

              ssl_certificate /etc/letsencrypt/live/{{ landing_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ landing_domain }}/privkey.pem;

              include /etc/nginx/snippets/polyglot-hardening.conf;

              location / {
                  proxy_pass http://localhost:{{ landing_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          {% else %}
          # Pre-TLS bootstrap: plain HTTP so certbot can issue the certificate.
          server {
              listen 80;
              server_name {{ landing_domain }}{% if landing_www_domain | length > 0 %} {{ landing_www_domain }}{% endif %};

              location / {
                  proxy_pass http://localhost:{{ landing_port }};
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          {% endif %}
      when: configure_landing_routing | bool
      notify: Reload nginx

    - name: Enable landing nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/polyglot-landing
        dest: /etc/nginx/sites-enabled/polyglot-landing
        state: link
      when: configure_landing_routing | bool
      notify: Reload nginx

    - name: Validate nginx config (landing)
      ansible.builtin.command: nginx -t
      changed_when: false
      when: configure_landing_routing | bool

    - name: Start nginx (landing)
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      when: configure_landing_routing | bool

    - name: Issue landing TLS certificate
      ansible.builtin.command:
        cmd: >-
          certbot --nginx --non-interactive --agree-tos
          --email {{ acme_email }}
          -d {{ landing_domain }}
          {% if landing_www_domain | length > 0 %}-d {{ landing_www_domain }}{% endif %}
        creates: "/etc/letsencrypt/live/{{ landing_domain }}/fullchain.pem"
      when:
        - configure_landing_routing | bool
        - acme_email | length > 0

  handlers:
    - name: Restart ssh
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
